<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="sky" x2="0" y2="1"><stop stop-color="#1b2940"/><stop offset="1" stop-color="#40566a"/></linearGradient>
    <linearGradient id="floor" x2="0" y2="1"><stop stop-color="#536346"/><stop offset="1" stop-color="#262f2c"/></linearGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="8" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <pattern id="pixels" width="64" height="64" patternUnits="userSpaceOnUse"><path d="M0 0h32v16H0zm32 24h32v24H32zM8 48h16v16H8z" fill="#ffffff" opacity=".035"/></pattern>
  </defs>
  <rect width="1280" height="720" fill="url(#sky)"/>
  <path d="M0 395h1280v325H0z" fill="url(#floor)"/>
  <path d="M0 395h1280v325H0z" fill="url(#pixels)"/>
  <!-- blocky hills and trees -->
  <path d="M0 360h120v-58h80v44h90v-90h95v128h120v-78h95v84h100v-52h90v-70h110v110h110v-48h115v135H0z" fill="#283b35"/>
  <path d="M0 410h230v-64h98v64h166v-85h115v85h144v-52h105v52h422v100H0z" fill="#34463d"/>
  <!-- wall obscuring the farther player -->
  <g opacity=".94" stroke="#28323c" stroke-width="4">
    <path d="M600 322h248v164H600z" fill="#7d6555"/>
    <path d="M600 322h248v34H600z" fill="#977a62"/>
    <path d="M684 356v130m82-130v130M600 408h248M600 460h248" fill="none"/>
  </g>
  <!-- blocky player silhouette helper, two layered outlines -->
  <g transform="translate(936 283)" filter="url(#glow)" stroke="#45e8ff" stroke-width="5" stroke-linejoin="round">
    <path d="M-29 0h58v51h-58z" fill="#54b9c9"/>
    <path d="M-42 55h84v93h-84z" fill="#346d82"/>
    <path d="M-83 60h35v83h-35zM48 60h35v83H48z" fill="#936b52"/>
    <path d="M-38 151h32v87h-32zM6 151h32v87H6z" fill="#26374b"/>
    <path d="M-29 18h58v17h-58z" fill="#b9edf0" stroke="none" opacity=".7"/>
  </g>
  <!-- nearer outlined player -->
  <g transform="translate(370 365)" filter="url(#glow)" stroke="#ffbf4d" stroke-width="5" stroke-linejoin="round">
    <path d="M-28 0h56v50h-56z" fill="#d7a77b"/>
    <path d="M-41 54h82v88h-82z" fill="#37789a"/>
    <path d="M-80 58h33v78h-33zM47 58h33v78H47z" fill="#d7a77b"/>
    <path d="M-37 145h31v82h-31zM6 145h31v82H6z" fill="#353b58"/>
    <path d="M-28 17h56v18h-56z" fill="#273343" stroke="none"/>
  </g>
  <rect x="52" y="46" width="515" height="90" rx="8" fill="#111923" opacity=".84" stroke="#4be5db" stroke-width="2"/>
  <text x="78" y="84" fill="#4be5db" font-family="Arial,sans-serif" font-size="24" font-weight="700" letter-spacing="2">ALCOVANISH</text>
  <text x="78" y="117" fill="#eef4f8" font-family="Arial,sans-serif" font-size="20">Подсветка игроков сквозь стены · пример эффекта</text>
  <rect x="880" y="46" width="348" height="91" rx="8" fill="#111923" opacity=".84" stroke="#71849a" stroke-width="2"/>
  <text x="906" y="81" fill="#a8b7c4" font-family="Arial,sans-serif" font-size="18">ЦИАНОВЫЙ — дальше</text>
  <text x="906" y="113" fill="#a8b7c4" font-family="Arial,sans-serif" font-size="18">ЯНТАРНЫЙ — ближе</text>
  <path d="M1000 528h245" stroke="#dbe6ec" opacity=".5"/>
  <text x="52" y="680" fill="#c3ced8" font-family="Arial,sans-serif" font-size="15" opacity=".8">Иллюстрация эффекта; не скриншот игры</text>
</svg>

